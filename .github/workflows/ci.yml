name: Rust CI

# Day-to-day checks run locally with scripts/check.sh. CI runs only for
# beta tags, pull requests and manual runs, not for every push to main.
on:
  push:
    tags: ["v*-beta*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Build
        run: cargo build --locked

      - name: Build beta executable
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo build --locked --release

      - name: Ad-hoc sign macOS executable
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        run: codesign --force --sign - target/release/hive-rail

      - name: Verify macOS signature
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        run: codesign --verify --strict --verbose=2 target/release/hive-rail

      - name: Package beta executable
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mkdir -p dist
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          cp "target/release/hive-rail${suffix}" \
            "dist/hive-rail-${RUNNER_OS}-${RUNNER_ARCH}${suffix}"

      - name: Upload beta executable
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: hive-rail-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error

  publish-beta:
    name: Publish beta release
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download platform executables
        uses: actions/download-artifact@v8
        with:
          pattern: hive-rail-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: cd dist && sha256sum hive-rail-* > SHA256SUMS

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Hive-Rail ${{ github.ref_name }} (early beta)
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*