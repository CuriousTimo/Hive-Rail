[package]
name = "hive-rail"
version = "0.1.0"
edition = "2021"
description = "Simulation-first foundation for the Hive-Rail node"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
zenoh = "1.5"