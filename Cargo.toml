[package]
name = "hive-rail"
version = "0.1.0"
edition = "2021"
description = "Simulation-first foundation for the Hive-Rail node"
license = "Apache-2.0"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = "0.28"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4.10.1", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
zenoh = "1.5"
[package.metadata.deb]
maintainer = "Curious T!mo <36850613+CuriousTimo@users.noreply.github.com>"
# Set explicitly because dpkg-shlibdeps is unavailable when packaging on macOS.
depends = "libc6 (>= 2.30)"
section = "misc"
