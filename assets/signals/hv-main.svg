<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 100" width="80" height="200" class="">
  <title>H/V light main signal (Lichthauptsignal): Hp 0 (two reds), Hp 1, Hp 2; Sh 1 and Zs 1 as options</title>
  <style>
  .sf-screen { fill: #0d0d0d; stroke: #3a3a3a; stroke-width: 0.8; }
  .sf-mast { fill: #8a8a8a; }
  .sf-lamp { fill: #262626; stroke: #3c3c3c; stroke-width: 0.6; }
  .sf-option { display: none; }
  .sh-lamp .sf-option.sh-lamp, .zs1-lamp .sf-option.zs1-lamp, .extra-lamp .sf-option.extra-lamp { display: inline; }
  /* H/V main */
  .hp0 .sf-red1, .hp0 .sf-red2 { fill: #ff2a1f; }
  .hp0.sh1 .sf-red2 { fill: #262626; }
  .hp1 .sf-green, .hp2 .sf-green { fill: #2fe05a; }
  .hp2 .sf-yellow { fill: #ffbf1a; }
  .sh1 .sf-white { fill: #f6f6f6; }
  .zs1 .sf-zs1 { fill: #f6f6f6; }
  /* H/V distant */
  .vr0 .sf-ll, .vr0 .sf-ur, .vr2 .sf-ll { fill: #ffbf1a; }
  .vr1 .sf-ll, .vr1 .sf-ur, .vr2 .sf-ur { fill: #2fe05a; }
  .short .sf-extra { fill: #f6f6f6; }
  .hp0 .sf-on-main .sf-ll, .hp0 .sf-on-main .sf-ur { fill: #262626; }
  /* Ks */
  .hp0 .sf-ks-red { fill: #ff2a1f; }
  .ks1 .sf-ks-green { fill: #2fe05a; }
  .ks2 .sf-ks-yellow { fill: #ffbf1a; }
  .zs1 .sf-ks-zs1 { fill: #f6f6f6; animation: sf-blink 1s steps(2, start) infinite; }
  /* light shunting signal */
  .sh0 .sf-sh-red, .hp0 .sf-sh-red { fill: #ff2a1f; }
  @keyframes sf-blink { to { visibility: hidden; } }
  </style>
  <rect class="sf-mast" x="18" y="76" width="4" height="24"/>
  <path class="sf-screen" d="M6 0 H34 L40 6 V76 H0 V6 Z"/>
  <circle class="sf-lamp sf-green" cx="11.5" cy="15" r="4.4"/>
  <circle class="sf-lamp sf-red1" cx="11.5" cy="29" r="4.4"/>
  <circle class="sf-lamp sf-red2" cx="28.5" cy="29" r="4.4"/>
  <circle class="sf-lamp sf-white sf-option sh-lamp" cx="29" cy="41" r="2.6"/>
  <circle class="sf-lamp sf-white sf-option sh-lamp" cx="11" cy="55" r="2.6"/>
  <circle class="sf-lamp sf-yellow" cx="11.5" cy="65" r="4.4"/>
  <g class="sf-option zs1-lamp">
    <rect class="sf-screen" x="8" y="78" width="24" height="14" rx="2"/>
    <circle class="sf-lamp sf-zs1" cx="20" cy="82" r="2.2"/>
    <circle class="sf-lamp sf-zs1" cx="13" cy="88" r="2.2"/>
    <circle class="sf-lamp sf-zs1" cx="27" cy="88" r="2.2"/>
  </g>
</svg>
