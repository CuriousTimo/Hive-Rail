; Phase B0: does zenoh-pico on an ESP32 join the Hive-Rail mesh?
; Build and flash:  pio run -e m5stick-c -t upload   (or -e esp32dev)
; Serial output:    pio device monitor

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
; Same release as the Rust nodes' zenoh crate (1.10.1).
lib_deps =
    https://github.com/eclipse-zenoh/zenoh-pico#1.10.1
    bblanchon/ArduinoJson@^7

; ESP32 DevKit (the 2021 board): serial output only
[env:esp32dev]
board = esp32dev

; M5StickC (ESP32-PICO-D4): a test device with its screen showing the node's state.
; Two 1.9 MB app slots (min_spiffs) for updates over Wi-Fi; the firmware is about 1.6 MB.
[env:m5stick-c]
board = m5stick-c
board_build.partitions = min_spiffs.csv
build_flags = -DHIVE_SCREEN -DHIVE_OTA
lib_deps =
    ${env.lib_deps}
    m5stack/M5Unified

; The same, flashed over Wi-Fi (once a firmware with OTA runs on it). The password is
; HIVE_OTA_PASS from include/secrets.h: pass it with  --upload-flags="--auth=<password>"
; or set it in platformio_override.ini (not committed).
[env:m5stick-c-ota]
extends = env:m5stick-c
upload_protocol = espota
upload_port = m5stickc.local
