; Phase B0: does zenoh-pico on an ESP32 join the Hive-Rail mesh?
; Build and flash:  pio run -e esp32dev -t upload   (or -e m5stick-c)
; Serial output:    pio device monitor

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
; Same release as the Rust nodes' zenoh crate (1.10.1).
lib_deps = https://github.com/eclipse-zenoh/zenoh-pico#1.10.1

; ESP32 DevKit (the 2021 board)
[env:esp32dev]
board = esp32dev

; M5StickC (ESP32-PICO-D4)
[env:m5stick-c]
board = m5stick-c
